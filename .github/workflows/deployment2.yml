name: deployment-2

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: get code for lint
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint


  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: get code for test
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm ci

      - name: test
        run: npm run test

  deploy:
     needs: [lint,test]
     runs-on: ubuntu-latest

     steps:
        - name: get code
          uses: actions/checkout@v4

        - name: Install dependencies
          run : npm ci

        - name: build
          run: npm run build

        - name: deploy
          run: echo "deploying..."
